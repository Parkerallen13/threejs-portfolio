<!doctype html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parker Allen — Design</title>
    <meta name="description" content="Portfolio of designer and illustrator Parker Allen: a scroll-through tour of a cartoon version of my living room." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..900,0..100,0..1;1,9..144,400..900,0..100,0..1&family=Pinyon+Script&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="world" aria-label="A cartoon of Parker's living room"></canvas>

    <header class="topbar">
      <p class="brand"><span class="brand__script">Design by</span> <span class="brand__name">Parker Allen</span></p>
      <nav class="actions">
        <button type="button" data-index>Index</button>
        <button type="button" class="actions__mode" data-mode-toggle>☾</button>
      </nav>
      <nav class="looks" aria-label="Character style"></nav>
    </header>

    <div class="progress" aria-hidden="true"></div>
    <div id="bubble" class="bubble" aria-hidden="true"></div>
    <div id="say" class="bubble bubble--say" aria-live="polite"></div>

    <main id="chapters"></main>

    <dialog id="panel" aria-labelledby="panel-title">
      <form method="dialog"><button class="panel__close" aria-label="Close">&times;</button></form>
      <div id="panel-body"></div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
