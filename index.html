<!doctype html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Parker Allen, a Creative Technology and Design student at CU Boulder's ATLAS Institute working in UI/UX design, UX research, graphic design, and front-end development."
    />
    <meta name="theme-color" content="#1d1a16" />
    <title>Parker Allen — UX Research, Design + Front-end</title>
  </head>
  <!-- Text, images, and links come from src/data/site.json (see main.js); the data-* hooks name each field. -->
  <body>
    <a class="skip-link" href="#projects">Skip to projects</a>
    <button type="button" class="lamp-toggle" data-mode-toggle aria-label="Switch to light mode" title="Switch to light mode"></button>
    <div class="backdrop" aria-hidden="true" data-backdrop></div>
    <header class="topbar">
      <nav class="floating-nav" aria-label="Main" data-nav>
        <a class="floating-nav__brand" href="./">Parker Allen</a>
        <a href="#ux" data-spy="ux">UX</a>
        <a href="#typography" data-spy="typography">Typography</a>
        <a href="#experience" data-spy="experience">Marketing</a>
        <a href="#artwork" data-spy="artwork">Drawings</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main id="content">
      <section class="intro" aria-labelledby="intro-title">
        <div class="intro__copy-block">
          <p class="eyebrow" data-text="intro.eyebrow"></p>
          <h1 id="intro-title" data-text="intro.name"></h1>
          <p class="intro__role" data-text="intro.role"></p>
          <p class="intro__copy" data-text="intro.copy"></p>
          <p class="intro__ethics" data-text="intro.ethics"></p>
          <a class="text-link" href="#projects"><span data-text="intro.cta"></span> <span aria-hidden="true">↓</span></a>
        </div>
        <a class="portrait" href="about.html" aria-label="About me">
          <span class="portrait__slot" aria-hidden="true"></span>
          <span class="portrait__title"><span data-text="intro.badge.title"></span> <span data-text="intro.badge.number"></span></span>
          <img data-img="intro.portrait" width="900" height="1125" alt="" />
          <dl class="portrait__fields" data-badge-fields></dl>
          <span class="portrait__stamp" aria-hidden="true">About me →</span>
        </a>
      </section>

      <aside class="atlas reveal reveal--pop" aria-labelledby="atlas-title">
        <div>
          <p class="eyebrow" id="atlas-title" data-text="atlas.title"></p>
          <p class="atlas__copy" data-text="atlas.copy"></p>
        </div>
        <ul class="atlas__core" aria-label="The ATLAS core courses" data-list="atlas.courses"></ul>
        <a class="atlas__link" data-href="atlas.href" target="_blank" rel="noopener noreferrer"><span data-text="atlas.linkLabel"></span> <span aria-hidden="true">↗</span></a>
      </aside>

      <section class="focus" aria-labelledby="focus-title">
        <div class="section-heading reveal">
          <p class="eyebrow" data-text="focus.eyebrow"></p>
          <h2 id="focus-title" data-text="focus.title"></h2>
        </div>
        <ol class="focus__list" data-focus-cards></ol>
      </section>

      <section id="tools" class="tools" aria-labelledby="tools-title">
        <div class="section-heading reveal">
          <p class="eyebrow" data-text="tools.eyebrow"></p>
          <h2 id="tools-title" data-text="tools.title"></h2>
        </div>
        <div class="tools__groups" data-tool-groups></div>
      </section>

      <section id="ux" class="work" aria-labelledby="ux-title">
        <div class="section-heading reveal">
          <p class="eyebrow" data-text="ux.eyebrow"></p>
          <h2 id="ux-title" data-text="ux.title"></h2>
        </div>
        <div id="projects" class="projects" tabindex="-1" data-projects="ux"></div>
      </section>

      <section id="typography" class="work" aria-labelledby="typography-title">
        <div class="section-heading reveal">
          <p class="eyebrow" data-text="typography.eyebrow"></p>
          <h2 id="typography-title" data-text="typography.title"></h2>
        </div>
        <div class="projects" data-projects="typography"></div>
      </section>

      <section id="experience" class="experience" aria-labelledby="experience-title">
        <div class="section-heading reveal">
          <p class="eyebrow" data-text="experience.eyebrow"></p>
          <h2 id="experience-title" data-text="experience.title"></h2>
        </div>
        <div class="experience__list" data-orgs></div>
      </section>

      <section id="artwork" class="artwork" aria-labelledby="artwork-title">
        <div class="artwork__heading reveal reveal--left">
          <h2 id="artwork-title" data-text="artwork.title"></h2>
          <a class="pill-link pill-link--instagram" data-href="artwork.instagram.href" target="_blank" rel="noopener noreferrer">
            <span data-text="artwork.instagram.label"></span> <span aria-hidden="true">↗</span>
          </a>
        </div>
        <div class="artwork__carousel">
          <div class="artwork__track" data-artwork-track aria-label="Scrollable artwork"></div>
          <div class="artwork__empty" data-artwork-empty>
            <p class="eyebrow">The sketchbook keeps going</p>
            <p>Add drawing images to <code>src/assets/drawings</code> to feature them here, or visit Instagram to see the collection.</p>
            <a data-href="artwork.instagram.href" target="_blank" rel="noopener noreferrer">Visit @designbyparkerallen <span aria-hidden="true">↗</span></a>
          </div>
          <div class="artwork__controls" data-artwork-controls hidden>
            <button type="button" data-artwork-prev aria-label="Scroll to previous drawings">←</button>
            <button type="button" data-artwork-next aria-label="Scroll to next drawings">→</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer reveal">
      <p data-text="footer.prompt"></p>
      <div class="footer__links">
        <a class="resume-button" data-href="footer.resume" target="_blank" rel="noopener"><span data-text="footer.resumeLabel"></span> <span aria-hidden="true">✦</span></a>
        <a class="linkedin-link" data-href="footer.linkedin" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect width="24" height="24" rx="5" fill="#0a66c2" />
            <circle cx="6.9" cy="6.7" r="1.65" fill="#fff" />
            <path fill="#fff" d="M5.5 9.4h2.8v9.2H5.5zM10.4 9.4h2.7v1.3c.4-.8 1.4-1.5 2.8-1.5 2.6 0 3.3 1.7 3.3 4v5.4h-2.8v-4.8c0-1.2-.3-2-1.4-2-1.2 0-1.8.8-1.8 2.1v4.7h-2.8z" />
          </svg>
        </a>
      </div>
      <span class="footer__credit" data-text="footer.credit"></span>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
